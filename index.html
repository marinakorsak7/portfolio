<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marina Korsak — Playable Ads Developer</title>
<meta name="description" content="Interactive HTML5 playable ads, concept to network-ready build.">

<!-- ═══════════════════════════════════════════════════════════════
     РЕДАКТИРУЕШЬ ТОЛЬКО ЭТИ ДВА БЛОКА.
     ═══════════════════════════════════════════════════════════════ -->
<script>
var PROFILE = {
  name:     "Marina Korsak",
  role:     "Playable Ads Developer",
  tagline:  "HTML5 · JavaScript · Canvas",
  email:    "marinakorsak7@gmail.com",
  linkedin: "https://www.linkedin.com/in/marina-korsak-990b36212/",
  telegram: "https://t.me/mendeleeva_07",
  resume:   "Marina_Korsak_CV.pdf",
  location: "Gdańsk, Poland · remote worldwide",
  bio: [
    "Playable ads developer with 5 years building HTML5 and JavaScript interactive ad creatives for international clients across major ad networks. I focus on lightweight, fast-loading playables that drive real engagement and conversion — not just look good in a deck.",
    "My workflow is AI-native: Claude Code, GitHub Copilot and Codex speed up coding, testing and iteration, so more concepts get tested before a deadline. I also build the in-playable visual assets and animation myself in Blender and Photoshop, working at the intersection of development and design.",
    "Before focusing on playables, I spent two years freelancing on responsive front-end — landing pages and cross-browser builds — shipped through Git/GitLab and SFTP."
  ],
  tools: ["HTML5","JavaScript","Canvas","CSS","Blender","Photoshop","Claude Code","GitHub Copilot","Codex","Git","GitLab"],
};

// folder = имя папки в репо (без пробелов!). Внутри — index.html.
// Если файл называется иначе, укажи путь целиком: folder: "play-2d-1/game.html".
// orientation: "portrait" или "landscape" — форма телефона под плейбл.
var PLAYABLES = [
  { folder: "play-3d-1", title: "Project 3D · 1", tag: "3D", orientation: "portrait" },
  { folder: "play-3d-2", title: "Project 3D · 2", tag: "3D", orientation: "portrait" },
  { folder: "play-3d-3", title: "Project 3D · 3", tag: "3D", orientation: "portrait" },
  { folder: "play-2d-1", title: "Project 2D · 1", tag: "2D", orientation: "portrait" },
  { folder: "play-2d-2", title: "Project 2D · 2", tag: "2D", orientation: "portrait" },
  { folder: "play-2d-3", title: "Project 2D · 3", tag: "2D", orientation: "portrait" },
];
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0d; --panel:#141619; --panel-2:#1a1d21; --ink:#f4f5f3; --muted:#9aa0a6; --dim:#5c6167; --line:#24272b;
    --accent:#2dd4bf; --accent-ink:#062420; --green:#34d399;
  }
  *{box-sizing:border-box}
  html{overflow-x:hidden;scroll-behavior:smooth}
  body{margin:0;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--ink);
    font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto;padding:0 clamp(18px,4vw,32px)}
  .eyebrow{font:600 11px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0}

  nav{position:sticky;top:0;z-index:30;background:rgba(10,11,13,.78);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:54px}
  .nav-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:15px;letter-spacing:-.01em}
  .nav-name span{color:var(--accent)}
  .nav-links{display:flex;gap:22px}
  .nav-links a{font:600 13px Inter,sans-serif;color:var(--muted);transition:color .15s}
  .nav-links a:hover{color:var(--ink)}

  main{display:flex;flex-direction:column;align-items:center;gap:24px;
    padding:clamp(20px,4vw,32px) clamp(10px,4vw,32px)}

  .stage{position:relative;width:100%;max-width:920px;height:min(74dvh,660px)}

  .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:20;
    width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
    background:rgba(20,22,25,.7);backdrop-filter:blur(6px);
    color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:.15s}
  .arrow:hover{border-color:var(--accent);color:var(--accent)}
  .arrow svg{width:18px;height:18px}
  .arrow.prev{left:clamp(0px,1vw,18px)}
  .arrow.next{right:clamp(0px,1vw,18px)}

  .slide{position:absolute;top:50%;left:50%;cursor:pointer;
    transition:transform .5s cubic-bezier(.22,.9,.32,1),opacity .5s ease,filter .5s ease}

  .phone{position:relative;background:#08090a;border-radius:38px;padding:10px;
    box-shadow:inset 0 0 0 2px #2c2f33,0 30px 70px -20px rgba(0,0,0,.85)}
  .phone.portrait{height:min(74dvh,660px);aspect-ratio:9/19.5}
  .phone.landscape{width:min(88vw,760px);aspect-ratio:19.5/9}
  .screen{position:relative;width:100%;height:100%;border-radius:25px;overflow:hidden;background:#000}
  .phone.landscape .screen{border-radius:20px}
  .screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}

  .poster{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    cursor:pointer;background:linear-gradient(160deg,#1b1e21,#0a0b0d)}
  .poster .play{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
    background:var(--accent);color:var(--accent-ink);
    box-shadow:0 10px 26px -8px rgba(45,212,191,.5);transition:.18s}
  .slide.current .poster:hover .play{transform:scale(1.08)}
  .poster .play svg{width:22px;height:22px;margin-left:3px}

  .expand{position:absolute;top:20px;right:20px;z-index:4;width:28px;height:28px;border-radius:8px;
    display:grid;place-items:center;background:rgba(8,7,13,.72);color:#fff;border:1px solid rgba(255,255,255,.14);cursor:pointer}
  .expand:hover{background:var(--accent);color:var(--accent-ink)}
  .expand svg{width:14px;height:14px}

  .dots{display:flex;gap:8px}
  .dots button{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer;transition:.15s}
  .dots button.on{background:var(--accent);width:20px;border-radius:4px}

  section{padding:clamp(52px,9vw,92px) 0}
  .sec-head{margin-bottom:clamp(24px,4vw,36px)}
  .sec-head h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(26px,4vw,38px);
    letter-spacing:-.02em;margin:12px 0 0}

  #about .about-grid{display:grid;grid-template-columns:1fr;gap:18px;max-width:720px}
  #about p{color:var(--muted);font-size:15.5px;line-height:1.7;margin:0 0 16px}
  #about p:last-child{margin-bottom:0}
  .tools{display:flex;flex-wrap:wrap;gap:9px;margin:28px 0 12px}
  .tool-tag{font:600 12.5px Inter,sans-serif;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:8px 14px}

  #contact{background:var(--panel);border-block:1px solid var(--line)}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
    background:var(--panel-2);border:1px solid var(--line);font:600 12px Inter,sans-serif;color:var(--green);margin-bottom:18px}
  .badge i{width:7px;height:7px;border-radius:50%;background:var(--green)}
  #contact .sec-head h2{max-width:14ch}
  #contact .sec-head p{color:var(--muted);font-size:15.5px;margin:14px 0 0;max-width:48ch}
  .contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
  .contact-card{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;transition:.15s}
  .contact-card:hover{border-color:var(--accent)}
  .contact-card .ic{flex:none;width:38px;height:38px;border-radius:10px;background:rgba(45,212,191,.13);
    color:var(--accent);display:grid;place-items:center}
  .contact-card .ic svg{width:18px;height:18px}
  .contact-card .txt{overflow:hidden}
  .contact-card .lbl{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .contact-card .val{font:700 14.5px Inter,sans-serif;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .contact-card.cv{background:rgba(45,212,191,.08);border-color:rgba(45,212,191,.3)}

  footer{padding:clamp(14px,2vw,20px);text-align:center;font:500 11px 'JetBrains Mono',monospace;
    letter-spacing:.06em;color:var(--dim)}

  @media(max-width:640px){
    nav .wrap{height:50px}
    .nav-name{font-size:13px}
    .nav-links{gap:12px}
    .nav-links a{font-size:12px}
    main{gap:0;padding:0}
    .stage{width:100%;max-width:none;height:calc(100dvh - 50px)}
    .slide{width:100%;height:100%}
    .phone{padding:0;border-radius:0;box-shadow:none;background:transparent}
    .phone.portrait,.phone.landscape{width:100%;height:100%;aspect-ratio:unset}
    .screen,.phone.landscape .screen{border-radius:0}
    .arrow{width:32px;height:32px;top:auto;bottom:12px;transform:none}
    .arrow svg{width:14px;height:14px}
    .arrow.prev{left:12px}
    .arrow.next{right:12px}
    .dots{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:15}
    .slide:not(.current){opacity:0!important;pointer-events:none!important}
    .expand{display:none}
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a href="#top" class="nav-name" id="navName"></a>
    <div class="nav-links">
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </div>
  </div>
</nav>

<div id="top"></div>
<main id="work">
  <div class="stage" id="stage">
    <button class="arrow prev" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="arrow next" id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <div class="dots" id="dots"></div>
</main>

<section id="about" class="wrap">
  <div class="sec-head">
    <p class="eyebrow">About</p>
    <h2>The person behind the build.</h2>
  </div>
  <div class="about-grid">
    <div id="aboutBio"></div>
    <div class="tools" id="toolTags"></div>
  </div>
</section>

<section id="contact">
  <div class="wrap">
    <span class="badge"><i></i>Available for new projects</span>
    <div class="sec-head">
      <h2>Got a game? Let's make it play.</h2>
      <p>Have a game that needs a high-performing playable — or a batch across networks? Reach out.</p>
    </div>
    <div class="contact-grid">
      <a class="contact-card" id="cardEmail">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 6l8 7 8-7"/></svg></span>
        <span class="txt"><span class="lbl">Email</span><br><span class="val" id="valEmail"></span></span>
      </a>
      <a class="contact-card" id="cardLinkedin" target="_blank" rel="noopener">
        <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.94 5a2 2 0 11-4-.002 2 2 0 014 .002zM7 8.48H3V21h4V8.48zM13.32 8.48H9.34V21h3.94v-6.57c0-1.66.31-3.26 2.37-3.26 2.03 0 2.06 1.9 2.06 3.37V21H21.7v-7.13c0-3.42-.74-6.05-4.73-6.05-1.92 0-3.2 1.05-3.73 2.05h-.05V8.48z"/></svg></span>
        <span class="txt"><span class="lbl">LinkedIn</span><br><span class="val">Marina Korsak</span></span>
      </a>
      <a class="contact-card" id="cardTelegram" target="_blank" rel="noopener">
        <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 4.5l-19 7.3c-.9.35-.9 1.65.02 1.98l4.6 1.6 1.8 5.6c.24.75 1.2.94 1.72.35l2.4-2.7 4.6 3.4c.7.5 1.7.13 1.9-.7L23 5.5c.2-.9-.7-1.6-1.5-1z"/></svg></span>
        <span class="txt"><span class="lbl">Telegram</span><br><span class="val" id="valTelegram"></span></span>
      </a>
      <a class="contact-card cv" id="cardResume" download>
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg></span>
        <span class="txt"><span class="lbl">Resume</span><br><span class="val">Download CV</span></span>
      </a>
    </div>
  </div>
</section>

<footer>
  <span id="footLine"></span>
</footer>

<script>
(function(){
  var P = window.PROFILE || {};
  var items = (window.PLAYABLES || []).filter(function(p){ return p && p.folder; });
  var path = function(f){ f=f.replace(/\/+$/,''); return /\.html?$/i.test(f) ? f : f + '/'; };
  var PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  var EXPAND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';

  document.title = (P.name||'Portfolio') + ' — ' + (P.role||'');
  document.getElementById('navName').innerHTML = (P.name||'Portfolio').replace(/(\S+)\s*$/, '<span>$1</span>');

  var email = P.email||'';
  document.getElementById('cardEmail').href = email ? 'mailto:'+email+'?subject=Playable%20ad%20inquiry' : '#';
  document.getElementById('valEmail').textContent = email;
  document.getElementById('cardLinkedin').href = P.linkedin || '#';
  document.getElementById('cardTelegram').href = P.telegram || '#';
  document.getElementById('valTelegram').textContent = (P.telegram||'').replace(/^https?:\/\/t\.me\//,'@');
  document.getElementById('cardResume').href = P.resume || '#';
  document.getElementById('footLine').textContent = [P.location, '© ' + new Date().getFullYear() + ' ' + (P.name||'')].filter(Boolean).join('   ·   ');

  var bioEl = document.getElementById('aboutBio');
  (P.bio||[]).forEach(function(par){ var p=document.createElement('p'); p.textContent=par; bioEl.appendChild(p); });
  var toolsEl = document.getElementById('toolTags');
  (P.tools||[]).forEach(function(t){ var s=document.createElement('span'); s.className='tool-tag'; s.textContent=t; toolsEl.appendChild(s); });

  var stage = document.getElementById('stage');
  var prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next');
  var dotsEl = document.getElementById('dots');
  var idx = 0, slideEls = [], resetFns = [];

  if(!items.length){
    prevBtn.hidden = nextBtn.hidden = true;
    var empty = document.createElement('div');
    empty.style.cssText = 'position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font:13px monospace';
    empty.textContent = 'Add playables to the PLAYABLES array.';
    stage.appendChild(empty);
  } else {
    items.forEach(function(pl, i){
      var ori = pl.orientation || 'portrait', src = path(pl.folder), loaded = false;
      var slide = document.createElement('div'); slide.className = 'slide';
      var phone = document.createElement('div'); phone.className = 'phone ' + ori;
      var screen = document.createElement('div'); screen.className = 'screen';
      var poster = document.createElement('div'); poster.className = 'poster';
      poster.innerHTML = '<div class="play">'+PLAY+'</div>';
      var frame = null, exp = null;
      poster.onclick = function(){
        if(i !== idx){ idx = i; layout(); return; }
        if(loaded) return; loaded = true;
        frame = document.createElement('iframe');
        frame.setAttribute('allow','autoplay; fullscreen'); frame.src = src;
        screen.appendChild(frame); poster.style.display = 'none';
        exp = document.createElement('button'); exp.className = 'expand'; exp.title = 'Fullscreen'; exp.innerHTML = EXPAND;
        exp.onclick = function(ev){ ev.stopPropagation(); (screen.requestFullscreen || screen.webkitRequestFullscreen).call(screen); };
        phone.appendChild(exp);
      };
      screen.appendChild(poster);
      phone.appendChild(screen);
      slide.appendChild(phone);
      stage.appendChild(slide);
      slideEls.push(slide);
      resetFns.push(function(){
        if(!loaded) return; loaded = false;
        if(frame){ frame.remove(); frame = null; }
        if(exp){ exp.remove(); exp = null; }
        poster.style.display = '';
      });
    });

    items.forEach(function(_, i){
      var d = document.createElement('button');
      d.onclick = function(){ idx = i; layout(); };
      dotsEl.appendChild(d);
    });

    prevBtn.onclick = function(){ idx = (idx - 1 + items.length) % items.length; layout(); };
    nextBtn.onclick = function(){ idx = (idx + 1) % items.length; layout(); };
    document.addEventListener('keydown', function(e){
      if(e.key === 'ArrowLeft') prevBtn.click();
      if(e.key === 'ArrowRight') nextBtn.click();
    });

    var touchX = null;
    stage.addEventListener('touchstart', function(e){ touchX = e.touches[0].clientX; });
    stage.addEventListener('touchend', function(e){
      if(touchX === null) return;
      var dx = e.changedTouches[0].clientX - touchX;
      if(Math.abs(dx) > 40) (dx < 0 ? nextBtn : prevBtn).click();
      touchX = null;
    });

    layout();
  }

  function layout(){
    var n = items.length;
    slideEls.forEach(function(el, i){
      var raw = i - idx;
      if(raw > n/2) raw -= n;
      if(raw < -n/2) raw += n;
      var absD = Math.abs(raw), clamped = Math.max(-2, Math.min(2, raw));
      var scale = absD === 0 ? 1 : absD === 1 ? .72 : .5;
      var opacity = absD === 0 ? 1 : absD === 1 ? .38 : 0;
      el.style.transform = 'translate(-50%,-50%) translateX('+(clamped*64)+'%) scale('+scale+')';
      el.style.opacity = opacity;
      el.style.zIndex = 10 - absD;
      el.style.pointerEvents = absD <= 1 ? 'auto' : 'none';
      el.style.filter = absD === 0 ? 'none' : 'saturate(.6)';
      el.classList.toggle('current', absD === 0);
      if(absD !== 0) resetFns[i]();
    });
    Array.from(dotsEl.children).forEach(function(d, i){ d.className = i === idx ? 'on' : ''; });
  }
})();
</script>
</body>
</html>
